{% extends "base.html" %}
{% block title %}MedPass — Staff Login{% endblock %}
{% block content %}
  <div class="card">
    <h1>Hospital staff login</h1>
    <p class="subtitle">Sign in to look up patients and manage appointments.</p>

    {% if error %}<p style="color:var(--danger); font-size:14px;">{{ error }}</p>{% endif %}

    <form method="post" action="/staff/login">
      <label class="required">Email</label>
      <input type="email" name="email" required>
      <label class="required">Password</label>
      <input type="password" name="password" required>
      <button type="submit">Log in</button>
    </form>
    <a class="button button-secondary" href="/staff/register">Create a hospital account</a>
  </div>
{% endblock %}
