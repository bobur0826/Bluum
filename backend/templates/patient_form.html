{% extends "auth_shell.html" %}
{% block title %}Bluum — Create Profile{% endblock %}
{% block content %}
  <h1>Create your profile</h1>
  <p class="subtitle">Just the basics for now — we'll ask for the rest a little at a time, before each visit.</p>

  {% if error %}<p style="color:var(--danger); font-size:14px;">{{ error }}</p>{% endif %}

  <form method="post" action="/patients">
    <label class="required">Full name</label>
    <input type="text" name="full_name" required>

    <label class="required">Date of birth</label>
    <input type="date" name="dob" required>

    <button type="submit">Create profile</button>
  </form>
{% endblock %}
