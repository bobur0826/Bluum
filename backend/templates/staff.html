{% extends "base.html" %}
{% block title %}Bluum — Staff Lookup{% endblock %}
{% block content %}
  <div class="card">
    <h1>Look up patient</h1>
    <p class="subtitle">Scan the patient's QR code with your camera app, or enter their code manually below.</p>

    {% if error %}
      <p style="color:var(--danger); font-size:14px;">{{ error }}</p>
    {% endif %}

    <form method="post" action="/staff/lookup">
      <label class="required">Patient code</label>
      <input type="text" name="token" required placeholder="e.g. yP4s5avq1bk" autocapitalize="off" autocorrect="off">
      <button type="submit">Open patient profile</button>
    </form>
  </div>
{% endblock %}
