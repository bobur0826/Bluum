<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bluum</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html, body {
      margin: 0; height: 100%; display: flex; align-items: center; justify-content: center;
      background: #16A34A; color: #fff; font-family: -apple-system, system-ui, sans-serif;
    }
    .pulse { font-size: 40px; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
    #error { display: none; max-width: 320px; text-align: center; padding: 0 24px; }
    #error a { color: #fff; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="pulse" id="loading">💚</div>
  <div id="error">
    <p>Couldn't verify your Telegram session. Open this from the Bluum bot's menu button instead of a plain browser link.</p>
  </div>
  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
      }
      var initData = tg && tg.initData;
      if (!initData) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "block";
        return;
      }
      fetch("/telegram/auth", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "init_data=" + encodeURIComponent(initData),
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data.redirect) {
            window.location.href = data.redirect;
          } else {
            throw new Error(data.error || "Login failed");
          }
        })
        .catch(function () {
          document.getElementById("loading").style.display = "none";
          document.getElementById("error").style.display = "block";
        });
    })();
  </script>
</body>
</html>
