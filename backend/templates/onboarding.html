<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bluum — Wherever you are, health comes first</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="onboarding-body">
  <div class="onboarding-screen">
    <div class="onboarding-art">
      <div class="lang-pills" style="position:absolute; top:16px; right:16px;">
        <a href="/set-lang/en" class="{{ 'active' if current_lang == 'en' }}">EN</a>
        <a href="/set-lang/uz" class="{{ 'active' if current_lang == 'uz' }}">UZ</a>
        <a href="/set-lang/ru" class="{{ 'active' if current_lang == 'ru' }}">RU</a>
      </div>
      <span class="onboarding-badge">{{ t('onboarding_badge') }}</span>
    </div>
    <div class="onboarding-panel">
      <h1 class="onboarding-title">{{ t('onboarding_title_pre') }}<span class="accent">{{ t('onboarding_title_accent') }}</span>{{ t('onboarding_title_post') }}</h1>
      <p class="onboarding-lead">{{ t('onboarding_lead') }}</p>
      <div class="onboarding-progress"><span class="on"></span><span></span><span></span></div>
      <a class="onboarding-cta" href="/patient/new/form">{{ t('onboarding_cta') }}</a>
      <a class="onboarding-secondary" href="/patient/login">{{ t('onboarding_login') }}</a>
    </div>
  </div>
</body>
</html>
