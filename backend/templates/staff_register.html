{% extends "base.html" %}
{% block title %}Bluum — Staff Registration{% endblock %}
{% block content %}
  <div class="card">
    <h1>Create a hospital account</h1>
    <p class="subtitle">For reception and doctors to check in patients and write appointment notes.</p>

    {% if error %}<p style="color:var(--danger); font-size:14px;">{{ error }}</p>{% endif %}

    <form method="post" action="/staff/register">
      <label class="required">Full name</label>
      <input type="text" name="full_name" required>
      <label>Hospital name</label>
      <input type="text" name="hospital_name" placeholder="e.g. AKFA Medline">
      <label class="required">Email</label>
      <input type="email" name="email" required>
      <label class="required">Password</label>
      <input type="password" name="password" required>
      <button type="submit">Create account</button>
    </form>
    <a class="button button-secondary" href="/staff/login">Already have an account? Log in</a>
  </div>
{% endblock %}
