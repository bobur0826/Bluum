{% extends "base.html" %}
{% block title %}MedPass — Patient Login{% endblock %}
{% block content %}
  <div class="card">
    <h1>Log in</h1>
    <p class="subtitle">Get back to your MedPass profile from any device — we'll text you a code.</p>

    {% if error %}<p style="color:var(--danger); font-size:14px;">{{ error }}</p>{% endif %}

    <form method="post" action="/patient/login">
      <label class="required">Phone number</label>
      <input type="tel" name="phone" required placeholder="+998 90 123 45 67">
      <button type="submit">Send me a code</button>
    </form>
    <a class="button button-secondary" href="/patient/new">New here? Create a profile</a>
  </div>
{% endblock %}
