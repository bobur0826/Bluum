# /etc/nginx/sites-available/medpass
# Reverse proxy: TLS terminates here, forwards to gunicorn on 127.0.0.1:5001.
# certbot --nginx will edit this file to add the actual cert paths + the
# port-80 redirect block automatically - run it after this file is in place.

server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Test results, documents, insurance cards etc. - matches uploads.py
    client_max_body_size 20M;
}
